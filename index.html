<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caderneta do Carro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: cartão do veículo com hodômetro de dígitos em destaque, abas coladas no topo, conteúdo em coluna única de cartões (máx. 760px).
   Cor: cinza azulado de fundo, tinta quase preta, um azul de acento (o azul da faixa da placa Mercosul). Série 1 a 3 do gráfico seguem a paleta validada. */
:root{
  --bg:#eceff3; --card:#fcfdfe; --ink:#0f1722; --ink2:#4a5565; --muted:#657083;
  --line:#dde2e8; --axis:#c2c9d3; --wash:rgba(15,23,34,.045);
  --accent:#1f55c4; --on-accent:#ffffff; --accent-soft:#e2eafa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#4a3aa7;
  --good:#0b7a3b; --good-bg:#dcf2e4; --warn:#8a5300; --warn-bg:#fdebc6; --crit:#b42318; --crit-bg:#fde2df; --info:#35527f; --info-bg:#e3eaf5;
  --odo-bg:#10151c; --odo-fg:#f3f5f8; --odo-edge:#2b3440;
  --ff-display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --ff-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1017; --card:#141c26; --ink:#e8edf4; --ink2:#aab4c3; --muted:#8893a3;
    --line:#243040; --axis:#364458; --wash:rgba(255,255,255,.06);
    --accent:#6b9bff; --on-accent:#08111f; --accent-soft:#1c2a45;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
    --good:#4fc07d; --good-bg:#16301f; --warn:#f2b84b; --warn-bg:#3a2c0e; --crit:#ff8a80; --crit-bg:#3d1816; --info:#9fb8e6; --info-bg:#1b2840;
    --odo-bg:#05080c; --odo-fg:#f3f5f8; --odo-edge:#2b3440;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1017; --card:#141c26; --ink:#e8edf4; --ink2:#aab4c3; --muted:#8893a3;
  --line:#243040; --axis:#364458; --wash:rgba(255,255,255,.06);
  --accent:#6b9bff; --on-accent:#08111f; --accent-soft:#1c2a45;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --good:#4fc07d; --good-bg:#16301f; --warn:#f2b84b; --warn-bg:#3a2c0e; --crit:#ff8a80; --crit-bg:#3d1816; --info:#9fb8e6; --info-bg:#1b2840;
  --odo-bg:#05080c; --odo-fg:#f3f5f8; --odo-edge:#2b3440;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.45}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin-inline:auto;padding-inline:16px;padding-block:16px 56px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.brand h1{font-family:var(--ff-display);font-weight:800;font-size:25px;letter-spacing:.2px;line-height:1;text-wrap:balance}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--wash)}

/* cartão do veículo */
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;display:grid;gap:12px}
.vhead{display:flex;align-items:center;gap:12px;width:100%;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.vhead .vname{flex:1;min-width:0;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vhead .vsub{display:block;font-weight:400;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.plate{display:inline-flex;flex-direction:column;align-items:stretch;flex:none;background:#fff;border:2px solid #1b1f24;border-radius:7px;overflow:hidden;min-width:88px}
.plate .band{background:#1b4aa6;color:#fff;font-size:7px;font-weight:700;letter-spacing:2px;text-align:center;padding:1px 6px;line-height:1.3}
.plate .chars{font-family:var(--ff-display);font-weight:800;font-size:21px;letter-spacing:1.5px;color:#14171b;text-align:center;line-height:1.05;padding:2px 8px 1px}
.plate.none .chars{font-size:13px;letter-spacing:1px;color:#6b7380;padding:5px 8px 4px}
.odo{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.odo .dg{display:grid;place-items:center;width:34px;height:50px;border-radius:6px;background:var(--odo-bg);border:1px solid var(--odo-edge);color:var(--odo-fg);font-family:var(--ff-display);font-weight:800;font-size:40px;line-height:1;box-shadow:inset 0 -10px 14px rgba(0,0,0,.35)}
.odo .unit{margin-left:6px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--warn)}
button.sync{background:none;border:0;padding:6px 0;min-height:36px;cursor:pointer;text-align:left;border-radius:8px}
button.sync span{text-decoration:underline dotted;text-underline-offset:3px}

/* abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px;background:var(--bg)}
.tabs:empty{display:none}
.tabs .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:52px;padding:6px 2px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:12px;font-weight:600;cursor:pointer}
.tab:hover{background:var(--wash)}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cartões e listas */
#view{display:grid;gap:14px;padding-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font-size:16px;font-weight:700;line-height:1.25;text-wrap:balance}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--crit);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.crit{color:var(--crit);background:var(--crit-bg)}
.pill.info{color:var(--info);background:var(--info-bg)}
.list{display:grid}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;width:100%;padding:12px 4px;margin:0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:0}
.list>.row:first-child{border-top:0}
.row:hover{background:var(--wash)}
.row.static{cursor:default}
.row.static:hover{background:transparent}
.r-main{min-width:0;flex:1}
.r-title{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-sub{font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.r-side{text-align:right;flex:none}
.r-val{font-weight:700;font-variant-numeric:tabular-nums}
.empty-note{padding:6px 0 2px;color:var(--muted);font-size:14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--info-bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.banner p{flex:1 1 220px;min-width:0}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .k-l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .k-v{font-family:var(--ff-display);font-weight:700;font-size:34px;line-height:1.05;margin-top:4px;letter-spacing:.2px}
.kpis.tight .k-v{font-size:clamp(20px,6.2vw,30px);white-space:nowrap}
.kpi .k-v small{font-family:var(--ff-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .k-s{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.k-s.up{color:var(--good)}.k-s.down{color:var(--warn)}
.alert-list{display:grid}
.alert{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 4px;cursor:pointer}
.alert:first-child{border-top:0}
.alert:hover{background:var(--wash)}
.alert .a-ic{flex:none;margin-top:2px}
.alert.crit .a-ic{color:var(--crit)}.alert.warn .a-ic{color:var(--warn)}
.alert .a-t{font-weight:600}
.alert .a-d{font-size:13px;color:var(--muted)}
.steps{display:grid}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 4px;cursor:pointer}
.step:first-child{border-top:0}
.step:hover{background:var(--wash)}
.step .chk{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--axis);color:transparent}
.step.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.step.done .st-t{color:var(--muted);text-decoration:line-through}

/* gráficos */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;max-width:100%}
.chart .t{fill:var(--muted);font-family:var(--ff-body);font-size:11px}
.chart .tv{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .avg{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.chart .s1{fill:var(--s1)}.chart .s2{fill:var(--s2)}.chart .s3{fill:var(--s3)}.chart .s4{fill:var(--s4)}
.chart .mk{transition:filter .12s}
.chart .mk.hov{filter:brightness(1.14)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:9px;font-size:12px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:220px}
.tip .tv{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.tip .tl{opacity:.8}
.tip .tk{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend i.ln{height:3px;border-radius:2px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;color:var(--muted);font-weight:600}

/* combustível */
.calc{display:grid;gap:10px}
.calc-out{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;min-height:28px}

/* pneus */
.tiregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tirecard{display:grid;gap:6px;align-content:start;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.tirecard:hover{background:var(--wash)}
.tirecard.spare{grid-column:1 / -1}
.tpos{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.tagb{flex:none;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;letter-spacing:.2px;text-transform:none}
.tname{font-weight:600;overflow-wrap:anywhere}
.tmeta{font-size:12.5px;color:var(--muted)}
.tadd{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13.5px}
.gauge{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge span{display:block;height:100%;border-radius:4px}
.gauge.good span{background:var(--good)}.gauge.warn span{background:var(--warn)}.gauge.crit span{background:var(--crit)}
.front-tag{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;text-align:center;margin-bottom:-2px}

/* formulários e janela */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,18,.58)}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));outline:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sheet-head h2{font-size:18px;font-weight:700;text-wrap:balance}
form{display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;min-width:0;min-height:46px;padding:0 12px;border:1px solid var(--axis);border-radius:11px;background:var(--card);font-size:16px}
textarea.inp{padding:10px 12px;min-height:90px;resize:vertical}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.formbar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.formbar .btn.primary{flex:1 1 160px}
.err{padding:10px 12px;border-radius:10px;background:var(--crit-bg);color:var(--crit);font-size:13.5px;font-weight:500}
.err.warn{background:var(--warn-bg);color:var(--warn)}
.del{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.del-q{font-size:14px;font-weight:600;color:var(--crit)}
.plan-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 72px 44px;gap:8px;align-items:end}
.plan-row .field label{font-size:12px}
.plan-head{display:grid;gap:6px}
.bullets{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;color:var(--ink2)}
hr{border:0;border-top:1px solid var(--line,rgba(128,128,128,.25));margin:2px 0;width:100%}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.toast.err{background:var(--crit);color:#fff}

@media (min-width:640px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .modal{align-items:center}
  .sheet{border-radius:18px;padding-bottom:20px}
}
@media (max-width:420px){
  .odo .dg{width:30px;height:46px;font-size:36px}
  .plan-row{grid-template-columns:minmax(0,1fr) 72px 64px 40px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" id="logo" aria-hidden="true"></span>
      <h1>Caderneta do Carro</h1>
    </div>
    <button class="icon-btn" id="btn-more" type="button" aria-label="Mais opções"></button>
  </header>
  <div id="vcard"></div>
  <nav id="tabs" class="tabs" aria-label="Seções do app"></nav>
  <main id="view"></main>
</div>
<div id="modal" class="modal" hidden>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

// <logic>
const MS_DAY=86400000;
const pad=n=>String(n).padStart(2,'0');
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayNum(s){ const p=s.split('-').map(Number); return Math.round(Date.UTC(p[0],p[1]-1,p[2])/MS_DAY); }
function dateFromDayNum(n){ const d=new Date(n*MS_DAY); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function addMonths(s,n){
  const p=s.split('-').map(Number);
  const first=new Date(Date.UTC(p[0],p[1]-1+n,1));
  const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
  return first.getUTCFullYear()+'-'+pad(first.getUTCMonth()+1)+'-'+pad(Math.min(p[2],last));
}
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' '); }
function parseDec(v){
  if(v==null) return NaN;
  let s=String(v).trim().replace(/\s/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  return /^\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
function parseKm(v){
  if(v==null) return NaN;
  let s=String(v).trim().replace(/\s/g,'');
  if(!s) return NaN;
  s=s.replace(/\./g,'').replace(',','.');
  return /^\d+(\.\d+)?$/.test(s)?Math.round(parseFloat(s)):NaN;
}
const DEFAULT_PLANS=[
  {type:'Troca de óleo e filtro',everyKm:10000,everyMonths:12},
  {type:'Filtro de ar',everyKm:15000,everyMonths:null},
  {type:'Filtro de cabine',everyKm:15000,everyMonths:12},
  {type:'Fluido de freio',everyKm:null,everyMonths:24},
  {type:'Alinhamento e balanceamento',everyKm:10000,everyMonths:null},

    if(!(l>0)||!(t>0)){ out.skipped.push({line:line,why:'Litros ou valor faltando'}); return; }

    let fuel=o.fuel||'gasolina';
    if(map.fuel>=0){ const fx=norm(get(r,map.fuel)); if(fx.indexOf('etanol')>=0||fx.indexOf('alcool')>=0) fuel='etanol'; else if(fx.indexOf('diesel')>=0) fuel='diesel'; else if(fx.indexOf('gnv')>=0) fuel='gnv'; else if(fx.indexOf('gasolina')>=0) fuel='gasolina'; }

    if(pp<2||pp>15) out.warnings.push({line:line,why:'Preço de R$ '+pp.toFixed(2).replace('.',',')+' por litro parece fora do normal'});
    if(o.tank&&l>o.tank*1.05) out.warnings.push({line:line,why:l.toFixed(2).replace('.',',')+' L é mais que o tanque ('+String(o.tank).replace('.',',')+' L)'});

  for(let i=1;i<items.length;i++){
    if(items[i].km<items[i-1].km){ bad++; out.warnings.push({line:items[i].line,why:'Km menor que o do abastecimento de '+fd(items[i-1].date)+' ('+items[i-1].km+')'}); }
  }
  out.orderRatio=items.length?bad/items.length:0;
  out.items=items;

}

const SH_SCRIPT="// Caderneta do Carro: ponte entre o app e esta planilha.\n// Não edite as abas \"CadernetaDados\" e \"App ...\" à mão: o app reescreve tudo a cada gravação.\nconst CHAVE = '__CHAVE__';\nconst ABA_DADOS = 'CadernetaDados';\nconst PEDACO = 40000;\nconst MAX_ABAS = 10; // só abas cujo nome começa com \"App \" podem ser reescritas\n\nfunction doGet() {\n  return ContentService.createTextOutput('Caderneta do Carro: endereço ativo. Abra o aplicativo para usar.');\n}\n\nfunction doPost(e) {\n  let saida;\n  try {\n    const req = JSON.parse(e.postData.contents);\n    if (!iguais_(String(req.key || ''), CHAVE) || CHAVE.indexOf('__') === 0) {\n      saida = { ok: false, error: 'chave' };\n    } else {\n      const lock = LockService.getScriptLock();\n      lock.waitLock(20000);\n      try { saida = tratar_(req); } finally { lock.releaseLock(); }\n    }\n  } catch (err) {\n    saida = { ok: false, error: 'erro: ' + err.message };\n  }\n  return ContentService.createTextOutput(JSON.stringify(saida)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction iguais_(a, b) {\n  if (a.length !== b.length) return false;\n  let r = 0;\n  for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return r === 0;\n}\n\nfunction aba_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  return ss.getSheetByName(ABA_DADOS) || ss.insertSheet(ABA_DADOS);\n}\n\nfunction tratar_(req) {\n  const sh = aba_();\n  const atual = Number(sh.getRange('B1').getValue()) || 0;\n  if (req.action === 'load') {\n    const n = Number(sh.getRange('B2').getValue()) || 0;\n    let dados = '';\n    if (n > 0) dados = sh.getRange(3, 1, n, 1).getValues().map(function (l) { return l[0]; }).join('');\n    return { ok: true, savedAt: atual, data: dados };\n  }\n  if (req.action === 'save') {\n    if (!req.force && atual !== 0 && Number(req.base) !== atual) return { ok: false, conflict: true, savedAt: atual };\n    const texto = String(req.data || '');\n    if (!texto) return { ok: false, error: 'vazio' };\n    const pedacos = [];\n    for (let i = 0; i < texto.length; i += PEDACO) pedacos.push([texto.slice(i, i + PEDACO)]);\n    const antigos = Number(sh.getRange('B2').getValue()) || 0;\n    if (antigos > 0) sh.getRange(3, 1, antigos, 1).clearContent();\n    sh.getRange(3, 1, pedacos.length, 1).setValues(pedacos);\n    const agora = Date.now();\n    sh.getRange('A1:B2').setValues([['salvo em', agora], ['pedaços', pedacos.length]]);\n    const tabelas = req.tables || {};\n    Object.keys(tabelas).filter(function (n) { return /^App [^\\[\\]*?:\\/\\\\]{1,60}$/.test(n); }).slice(0, MAX_ABAS).forEach(function (nome) {\n      const linhas = tabelas[nome];\n      if (!Array.isArray(linhas) || !linhas.length) return;\n      const ss = SpreadsheetApp.getActiveSpreadsheet();\n      const ab = ss.getSheetByName(nome) || ss.insertSheet(nome);\n      const larg = linhas[0].length;\n      const lim = linhas.map(function (l) { const c = l.slice(0, larg); while (c.length < larg) c.push(''); return c; });\n      ab.clearContents();\n      ab.getRange(1, 1, lim.length, larg).setValues(lim);\n      ab.setFrozenRows(1);\n    });\n    return { ok: true, savedAt: agora };\n  }\n  return { ok: false, error: 'acao' };\n}\n";

const SH_KEY='caderneta-do-carro:planilha', SH_PEND='caderneta-do-carro:pendente';
const SH={ok:!window.claude&&typeof fetch==='function',url:'',key:'',state:'off',lastSaved:0,lastWrite:0,busy:false,dirty:false,timer:null,err:'',pending:false,loaded:false,remote:null,txt:''};
const SH_URL_RE=/^https:\/\/script\.google\.com\/[^\s]+\/exec$/;
function shReadCfg(){

function shSetPending(on){ SH.pending=on; try{ if(on) localStorage.setItem(SH_PEND,'1'); else localStorage.removeItem(SH_PEND); }catch(e){} }
function shErr(kind,msg){ const e=new Error(msg); e.kind=kind; return e; }
async function shCall(body,opt){
  const ctl=typeof AbortController==='function'?new AbortController():null; const to=setTimeout(()=>{ if(ctl) ctl.abort(); },30000);
  const payload=JSON.stringify(Object.assign({key:SH.key},body));
  let res;
  try{ res=await fetch(SH.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload,redirect:'follow',credentials:'omit',signal:ctl?ctl.signal:undefined,keepalive:!!(opt&&opt.keepalive)&&payload.length<60000}); }
  catch(e){ clearTimeout(to); throw shErr('net','Sem conexão com o Google.'); }
  clearTimeout(to);
  let j=null; try{ j=JSON.parse(await res.text()); }catch(e){}
  if(!j||typeof j!=='object') throw shErr('access','O endereço não respondeu como o script esperado. Confira se a implantação está com acesso «Qualquer pessoa» e se o endereço termina em /exec.');
  if(j.ok===false&&j.error==='chave') throw shErr('key','A chave não confere com a do script.');
  if(j.ok===false&&!j.conflict) throw shErr('server','O script respondeu com erro: '+(j.error||'desconhecido'));
  return j;
}
function shTables(){

    ['DE','DD','TE','TD','ES'].forEach(pos=>{
      const t=v.tires&&v.tires[pos]; if(!t) return;
      const gs=[...(t.grooves||[])].sort((a,b)=>a.km-b.km); const lg=gs[gs.length-1];

      gs.forEach(x=>grooveRows.push([v.name,t.tag||'',posName(pos),x.date,x.km,x.mm]));

    [...(v.tireHistory||[])].sort((a,b)=>D8(a.removeDate,b.removeDate)).forEach(x=>tireRows.push([v.name,x.tag||'','Retirado',x.pos?posName(x.pos):'',x.brand||'',x.size||'',x.dot||'',x.installDate||'',x.installKm==null?'':x.installKm,x.price||'',x.groove0==null?'':x.groove0,x.lastGroove==null?'':x.lastGroove,'','',x.removeDate||'',x.removeKm==null?'':x.removeKm]));
    [...(v.tireEvents||[])].sort((a,b)=>D8(a.date,b.date)||a.km-b.km).forEach(e=>{

    });
    [...(v.wear||[])].sort((a,b)=>D8(a.date,b.date)||a.km-b.km).forEach(w=>wearRows.push([v.name,(WEAR_PARTS[w.part]||{label:w.part}).label,w.date,w.km,w.mm,w.fresh?'sim':'']));
  });

  const expRows=[['Veículo','Data','Tipo','Valor','Observações']];

}

async function shPush(force,opt){
  if(SH.state==='off'||!SH.loaded) return;
  if(SH.state==='conflict'&&!force) return;
  if(SH.busy){ SH.dirty=true; return; }
  SH.busy=true;
  try{
    do{
      SH.dirty=false;
      const r=await shCall({action:'save',base:SH.lastSaved,force:!!force,data:JSON.stringify(envelope()),tables:shTables()},opt);
      if(r.conflict){ SH.state='conflict'; SH.remote=null; SH.dirty=false; render(); openShConflict(); return; }
      SH.lastSaved=r.savedAt; SH.lastWrite=Date.now(); SH.err=''; SH.state='ready'; force=false; shWriteCfg(); markBackup();
      if(!SH.dirty) shSetPending(false);
    }while(SH.dirty);
    shSay();
  }catch(e){ SH.state=e.kind==='net'?'offline':'error'; SH.err=e.message||'erro'; shSay(); if(e.kind!=='net') toast('Não consegui gravar no Google Sheets. Os dados continuam salvos neste aparelho.','err'); }
  finally{ SH.busy=false; }
}

}

async function shSync(quiet){

    const r=await shCall({action:'load'});
    const had=SH.loaded; SH.err='';
    if(!r.data){ SH.loaded=true; SH.state='ready'; SH.lastSaved=r.savedAt||0; if(S.vehicles.length) await shPush(true); shSay(); return; }
    const env=readEnvelope(r.data);
    if(r.savedAt===SH.lastSaved&&had&&!SH.pending){ SH.state='ready'; shSay(); return; }
    if(!SH.pending){ S.vehicles=env.vehicles; SH.lastSaved=r.savedAt; SH.loaded=true; SH.state='ready'; afterLoad(); saveLocal(); shWriteCfg(); markBackup(); render(); return; }
    if(r.savedAt===SH.lastSaved){ SH.loaded=true; SH.state='ready'; await shPush(); return; }
    SH.loaded=true; SH.state='conflict'; SH.remote={env:env,savedAt:r.savedAt}; render(); openShConflict();
  }catch(e){ SH.loaded=SH.loaded||false; SH.state=e.kind==='net'?'offline':'error'; SH.err=e.message||'erro'; shSay(); }
}

    h('div',{style:'display:grid;gap:10px'},

      h('button',{type:'button',class:'btn danger',onclick:()=>finish(false)},'Usar os dados deste aparelho (substitui a planilha)'),
      h('button',{type:'button',class:'btn',onclick:()=>doBackup()},'Baixar backup deste aparelho'),
      h('button',{type:'button',class:'btn ghost',onclick:()=>{ SH.url=old.url; SH.key=old.key; closeModal(); }},'Cancelar'))),false);
}

async function init(){
  loadUI(); render();
  let db=null,uid_=null;
  try{
    if(window.claude&&window.claude.use){
      db=await withTimeout(window.claude.use('db'),4000);

      uid_=user?await user.id():null;
    }
  }catch(e){ db=null; }
  if(db&&uid_){
    try{
      const coll=db.collection('data/users/'+uid_);
      S.mode='cloud'; cloud={coll:coll,unsub:null};
      cloud.unsub=coll.onSnapshot(onSnap,e=>failCloud(e));
      setTimeout(()=>{ if(!S.ready){ S.ready=true; afterLoad(); render(); } },3500);
      return;
    }catch(e){ cloud=null; }
  }
  S.mode='local'; S.vehicles=loadLocal();
  if(FILE.ok){ try{ await fileInit(); }catch(e){ FILE.state='error'; FILE.err=(e&&e.message)||''; } }
  if(SH.ok) shReadCfg();
  S.ready=true; afterLoad(); render();
  if(SH.state!=='off') shSync(true);
}

function wireForm(form,handler){

  const err=h('div',{class:'err',role:'alert',hidden:true}); form.insertBefore(err,btn.parentNode);

function kmConflict(v,date,km,skipId){

  return all.find(r=>r.id!==skipId&&r.date&&typeof r.km==='number'&&((r.date<date&&r.km>km)||(r.date>date&&r.km<km)))||null;

/* abastecimento */
function openFuelForm(v,rec){
  const edit=!!rec; const last=[...v.fuel].sort(byDateDesc)[0];
  const date=I('ff-date',{type:'date',value:edit?rec.date:todayStr()});
  const km=I('ff-km',{inputmode:'numeric',value:edit?String(rec.km):'',placeholder:last?'Maior que '+nf0.format(last.km):'Km do painel'});
  const fuel=SEL('ff-fuel',FUELS,edit?rec.fuel:(last?last.fuel:v.fuelDefault));
  const L=I('ff-l',{inputmode:'decimal',placeholder:'0,00',value:edit?fmtIn(rec.liters):''});
  const P=I('ff-p',{inputmode:'decimal',placeholder:'0,000',value:edit?fmtIn((rec.total/rec.liters).toFixed(3)):''});
  const T=I('ff-t',{inputmode:'decimal',placeholder:'0,00',value:edit?fmtIn(rec.total):''});
  const full=h('input',{type:'checkbox',id:'ff-full',checked:edit?rec.full:true});
  const station=I('ff-st',{value:edit?(rec.station||''):'',placeholder:'Opcional',maxlength:'40'});
  let edited=edit?['l','t']:[];
  const recalc=k=>{
    edited=edited.filter(x=>x!==k); edited.push(k); if(edited.length>2) edited.shift(); if(edited.length<2) return;
    const third=['l','p','t'].find(x=>edited.indexOf(x)<0);
    const l=parseDec(L.value),p=parseDec(P.value),t=parseDec(T.value);
    if(third==='t'&&l>0&&p>0) T.value=fmtIn((l*p).toFixed(2));
    if(third==='l'&&p>0&&t>0) L.value=fmtIn((t/p).toFixed(2));
    if(third==='p'&&l>0&&t>0) P.value=fmtIn((t/l).toFixed(3));
  };
  L.addEventListener('input',()=>recalc('l')); P.addEventListener('input',()=>recalc('p')); T.addEventListener('input',()=>recalc('t'));
  const form=h('form',{novalidate:true},
    ROW2(F('ff-date','Data',date),F('ff-km','Km do painel',km)),
    F('ff-fuel','Combustível',fuel),
    h('div',{class:'row3'},F('ff-l','Litros',L),F('ff-p','R$ por litro',P),F('ff-t','Total (R$)',T)),
    h('div',{class:'hint',style:'margin-top:-6px'},'Preencha dois dos três. O terceiro é calculado.'),
    h('label',{class:'check'},full,h('span',null,h('b',null,'Encheu o tanque até o bico'),h('br'),h('span',{class:'hint'},'É assim que o consumo é calculado. Se foi só um pouco, desmarque.'))),
    F('ff-st','Posto',station),
    submitBar(edit?'Salvar alterações':'Salvar abastecimento',edit?deleteBlock('Apagar',()=>{ v.fuel=v.fuel.filter(x=>x.id!==rec.id); closeModal(); commit(v,'Abastecimento apagado.'); }):null)
  );
  wireForm(form,ack=>{
    if(!validDate(date.value)) return {error:'Informe a data.'};
    const k=parseOdo(km.value); if(isNaN(k)||k<=0) return {error:'Informe o km do painel com números.'};
    let l=parseDec(L.value),t=parseDec(T.value),p=parseDec(P.value);
    if(!(t>0)&&l>0&&p>0) t=l*p;
    if(!(l>0)&&t>0&&p>0) l=t/p;
    if(!(l>0)||!(t>0)) return {error:'Preencha dois entre litros, preço por litro e total.'};
    l=+l.toFixed(2); t=+t.toFixed(2);
    const warns=[];
    const c=kmConflict(v,date.value,k,edit?rec.id:null);
    if(c) warns.push('Já existe um registro de '+fmtDate(c.date)+' com '+nf0.format(c.km)+' km. Esse km parece fora de ordem.');
    if(v.tank&&l>v.tank*1.05) warns.push('Você informou '+nf2.format(l)+' L, mas o tanque comporta '+fmtIn(v.tank)+' L.');
    const pp=t/l; if(pp<2||pp>15) warns.push('O preço de '+brl.format(pp)+' por litro parece fora do normal.');
    if(dayNum(date.value)>dayNum(todayStr())+1) warns.push('A data está no futuro.');
    if(warns.length&&!ack) return {warn:warns};
    const data={date:date.value,km:k,liters:l,total:t,fuel:fuel.value,full:full.checked,station:station.value.trim()};
    if(edit) Object.assign(rec,data); else v.fuel.push(Object.assign({id:'f_'+uid()},data));
    closeModal(); commit(v,edit?'Abastecimento atualizado.':'Abastecimento salvo.'); return {ok:true};
  });
  openModal(edit?'Editar abastecimento':'Novo abastecimento',form,!edit);
}

function openPlans(v){
  const rows=[];

    row.el=el; rows.push(row); box.append(el);

    h('datalist',{id:'pl-types'},SERVICE_TYPES.map(t=>h('option',{value:t}))),

      h('button',{type:'button',class:'btn',onclick:()=>{
        const have=new Set(rows.filter(r=>!r.removed).map(r=>norm(r.t.value)));

        add.forEach(d=>addRow(Object.assign({id:'p_'+uid()},d)));

      }},'Adicionar sugeridos')),
    submitBar('Salvar lembretes')
  );
  wireForm(form,()=>{
    const out=[];

      const tp=r.t.value.trim(); const kk=r.k.value.trim()?parseKm(r.k.value):null; const mm=r.m.value.trim()?parseKm(r.m.value):null;

    }
    v.plans=out; closeModal(); commit(v,'Lembretes salvos.'); return {ok:true};
  });
  openModal('Lembretes de manutenção',form,false);
}

function decodeFileBuffer(buf){
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder('windows-1252').decode(buf); }catch(e2){ return new TextDecoder().decode(buf); } }
}

/* backup */
function csvFuel(v){
  const st=new Map(fuelStats(v.fuel).map(x=>[x.id,x]));
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const n=x=>x==null?'':String(x).replace('.',',');
  const rows=[['Data','Km','Combustível','Tanque cheio','Litros','Preço por litro','Total','Posto','Consumo km/L']];
  [...v.fuel].sort((a,b)=>a.km-b.km).forEach(f=>{ const s2=st.get(f.id); rows.push([f.date,f.km,fuelName(f.fuel),f.full?'sim':'não',n(f.liters),n((f.total/f.liters).toFixed(3)),n(f.total),f.station||'',s2?n(s2.kmpl.toFixed(2)):'']); });
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}
function browserDownload(filename,data){
  try{
    const type=/\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/json;charset=utf-8';
    const url=URL.createObjectURL(new Blob([data],{type:type}));
    const a=h('a',{href:url,download:filename}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); return true;
  }catch(e){ return false; }
}
async function saveFile(filename,data,onOk){
  let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
  if(!dl){ if(!window.claude&&browserDownload(filename,data)){ if(onOk) onOk(); toast('Arquivo baixado.'); return; } textFallback(filename,data); return; }
  try{ await dl.save({filename:filename,data:data}); if(onOk) onOk(); toast('Arquivo salvo.'); }
  catch(e){ const c=e&&e.code; if(c==='declined') return; if(c==='rate_limited'){ toast('Espere um instante e tente de novo.'); return; } textFallback(filename,data); }
}
function textFallback(filename,data){
  const ta=h('textarea',{class:'inp',readonly:true,style:'min-height:220px;font-size:12px'},data);
  const copy=h('button',{type:'button',class:'btn primary',onclick:async()=>{ try{ await navigator.clipboard.writeText(data); toast('Copiado.'); }catch(e){ ta.focus(); ta.select(); toast('Selecionei o texto. Copie com o atalho do seu aparelho.'); } }},'Copiar tudo');

}

/* ---------- gráficos ---------- */
let observers=[];
function disposeCharts(){ observers.forEach(o=>o.disconnect()); observers=[]; }
function mountChart(box,draw){
  let w0=0;
  const run=()=>{ const w=Math.floor(box.clientWidth); if(w<=0||w===w0) return; w0=w; box.replaceChildren(); draw(box,w); };
  run();
  if(window.ResizeObserver){ const o=new ResizeObserver(run); o.observe(box); observers.push(o); }
}
function barPath(x,y,w,hh,r,top){
  if(!top||hh<r*1.5||w<r*2) return 'M'+x+' '+y+'h'+w+'v'+hh+'h'+(-w)+'Z';
  return 'M'+x+' '+(y+hh)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+hh)+'Z';
}
function tipShow(box,tip,x,y,lines){
  tip.replaceChildren.apply(tip,lines); tip.hidden=false;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  const left=Math.max(4,Math.min(x-tw/2,box.clientWidth-tw-4)); let top=y-th-10; if(top<0) top=y+14;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function hitRect(box,tip,bar,x,y,w,hh,label,lines,ax,ay){

function tireCard(v,pos,label,today){
  const t=v.tires[pos], kmNow=currentKm(v);
  const c=h('button',{type:'button',class:'tirecard'+(pos==='ES'?' spare':''),onclick:()=>openTire(v,pos)},h('div',{class:'tpos'},h('span',null,label),t&&t.tag?h('span',{class:'tagb'},'Pneu '+t.tag):null));
  if(!t){ c.append(h('div',{class:'tname muted'},'Sem pneu cadastrado'),h('div',{class:'tadd'},icon('plus',16),'Cadastrar')); return c; }
  const g=tireGroove(t), al=tireAlerts(t,today), d=dotInfo(t.dot,today);
  c.append(h('div',{class:'tname'},(t.brand||'Pneu')+(t.size?' · '+t.size:'')));
  if(g){
    const lvl=g.mm<=1.6?'crit':g.mm<=3?'warn':'good'; const bar=h('span');
    bar.style.width=Math.round(Math.max(0.04,Math.min(1,g.mm/(t.groove0||8)))*100)+'%';
    c.append(h('div',{class:'gauge '+lvl,role:'img','aria-label':'Sulco de '+nf1.format(g.mm)+' milímetros'},bar),h('div',{class:'tmeta num'},'Sulco '+nf1.format(g.mm)+' mm'));
  } else c.append(h('div',{class:'tmeta'},'Sulco ainda não medido'));
  const meta=[]; if(pos!=='ES'&&t.installKm!=null) meta.push(nf0.format(Math.max(0,kmNow-t.installKm))+' km rodados'); if(d) meta.push(nf1.format(d.ageYears)+' anos de fábrica');
  if(meta.length) c.append(h('div',{class:'tmeta num'},meta.join(' · ')));
  const worst=al.find(a=>a.lvl==='crit')||al[0];
  if(worst) c.append(h('div',null,pill(worst.lvl,worst.lvl==='crit'?'Trocar':'Atenção')));
  else if(g||d) c.append(h('div',null,pill('good','Ok')));
  return c;
}

  if(ev.length>0){
    evCard.append(h('div',{class:'lbl',style:'margin-top:12px'},'Registros'),h('div',{class:'list'},ev.slice(0,12).map(e=>h('button',{type:'button',class:'row',onclick:()=>eventForm(v,e.kind,e)},
      h('div',{class:'r-main'},h('div',{class:'r-title'},e.kind==='rodizio'?'Rodízio':'Calibragem'),h('div',{class:'r-sub num'},sub(e,'')+(e.moves&&e.moves.length?' · '+e.moves.map(moveText).join(', '):'')+(e.note?' · '+e.note:'')))))));
  }
  root.append(evCard);
  const hist=[...v.tireHistory].sort((a,b)=>String(b.removeDate).localeCompare(String(a.removeDate)));
  if(hist.length){

        return h('div',{class:'row static'},h('div',{class:'r-main'},h('div',{class:'r-title'},(x.tag?'Pneu '+x.tag+' · ':'')+posName(x.pos)+' · '+(x.brand||'Pneu')),h('div',{class:'r-sub num'},[x.installDate?fmtDate(x.installDate):null,fmtDate(x.removeDate)].filter(Boolean).join(' a ')+(life!=null?' · '+nf0.format(life)+' km':''))),
          h('div',{class:'r-side'},per?h('div',{class:'r-val'},brl.format(per)):null,per?h('div',{class:'r-sub'},'por 1.000 km'):null));
      }))));

function render(){
  disposeCharts();

  const v=S.ready?V():null;
  renderTop(v); renderTabs(v);
  const view=$('#view'); view.replaceChildren();
  if(!S.ready){ view.append(h('section',{class:'card'},h('p',{class:'muted'},'Carregando seus dados...'))); return; }

function boot(){
  $('#logo').append(icon('car',19));
  $('#btn-more').append(icon('more',22));
  $('#btn-more').addEventListener('click',openMore);
  const modal=$('#modal');
